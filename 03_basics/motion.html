<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Motion Detection Security System</title>
  <style>
    body { margin:0; display:flex; flex-direction:column; align-items:center; background:#111; color:#fff; font-family:sans-serif; }
    #wrap { position:relative; width:640px; height:480px; margin-top:20px; }
    video, canvas { position:absolute; top:0; left:0; width:100%; height:100%; }
    #status { margin-top:20px; font-size:1.5rem; }
    #shots { display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
    #shots img { width:160px; border:2px solid red; border-radius:8px; }
  </style>
</head>
<body>
  <h1>🚨 Motion Detection Security System</h1>
  <div id="wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <div id="status">Status: idle</div>
  <div id="shots"></div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const shots = document.getElementById('shots');

    let prevFrame = null;
    let lastSnapTime = 0;

    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        video.addEventListener('playing', () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          detectMotion();
        });
      } catch (err) {
        console.error("Camera error:", err);
        statusEl.textContent = "Camera error: " + err.message;
      }
    }

    function beep() {
      const ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctxAudio.createOscillator();
      const gain = ctxAudio.createGain();
      osc.type = "sine";
      osc.frequency.value = 800;
      osc.connect(gain);
      gain.connect(ctxAudio.destination);
      osc.start();
      osc.stop(ctxAudio.currentTime + 0.3);
    }

    function takeSnapshot() {
      const snapCanvas = document.createElement("canvas");
      snapCanvas.width = video.videoWidth;
      snapCanvas.height = video.videoHeight;
      snapCanvas.getContext("2d").drawImage(video, 0, 0);
      const img = new Image();
      img.src = snapCanvas.toDataURL("image/png");
      shots.prepend(img); // add to gallery
    }

    function detectMotion() {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const frame = ctx.getImageData(0, 0, canvas.width, canvas.height);

      if (prevFrame) {
        let diff = 0;
        for (let i = 0; i < frame.data.length; i += 4) {
          const avg1 = (frame.data[i] + frame.data[i+1] + frame.data[i+2]) / 3;
          const avg2 = (prevFrame.data[i] + prevFrame.data[i+1] + prevFrame.data[i+2]) / 3;
          diff += Math.abs(avg1 - avg2);
        }
        const avgDiff = diff / (frame.data.length / 4);

        if (avgDiff > 25) {
          statusEl.textContent = "🚨 Motion detected!";
          statusEl.style.color = "red";

          const now = Date.now();
          if (now - lastSnapTime > 2000) { // 1 snapshot every 2s
            takeSnapshot();
            beep(); // play alarm sound
            lastSnapTime = now;
          }
        } else {
          statusEl.textContent = "✅ No motion";
          statusEl.style.color = "lime";
        }
      }

      prevFrame = frame;
      requestAnimationFrame(detectMotion);
    }

    initCamera();
  </script>
</body>
</html>
